name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m black --check firewall fuzzer target_app evaluation hardening tests
      - run: python -m pytest -q
      - name: Run sandbox red-team regression gate
        run: python -m evaluation.regression_gate
