[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelloop"
version = "0.2.0"
description = "A self-hardening prompt-injection firewall with a red-team fuzzer and a learning lab (sandbox only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "For education and authorized security research" }
dependencies = ["fastapi>=0.110,<1", "pypdf>=5,<8", "uvicorn[standard]>=0.29,<1"]

[project.optional-dependencies]
train = ["scikit-learn>=1.4,<2"]
report = ["matplotlib>=3.8,<4"]
storage = ["psycopg[binary]>=3.2,<4"]
jobs = ["redis>=5,<7", "rq>=2,<3"]
tracking = ["mlflow>=2.10,<4"]
dev = ["black>=24.8,<27", "httpx>=0.27,<1", "pre-commit>=3.8,<5", "pytest>=8,<10", "ruff>=0.5,<1"]
all = ["sentinelloop[train,report,dev]"]

[project.scripts]
sentinelloop = "sentinelloop.cli:main"

[tool.setuptools.packages.find]
include = ["sentinelloop*", "target_app*", "fuzzer*", "firewall*", "evaluation*", "hardening*"]

[tool.setuptools.package-data]
"firewall.gateway" = ["dashboard.html"]
"firewall.policies" = ["tool_policy.json"]
"firewall.models" = ["*.json"]
fuzzer = ["seeds/*.json"]
evaluation = ["manifest.json", "benign/*.json", "train/*.json", "validation/*.json", "holdout/*.json"]
"hardening.training" = ["benign_background.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
line-length = 110
target-version = ["py311"]
