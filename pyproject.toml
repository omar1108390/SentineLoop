[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelloop"
version = "0.1.0"
description = "A sandboxed prompt-injection firewall and red-team benchmark"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1"]

[project.optional-dependencies]
train = ["scikit-learn>=1.4,<2"]
storage = ["psycopg[binary]>=3.2,<4"]
jobs = ["redis>=5,<7", "rq>=2,<3"]
dev = ["pytest>=8,<10", "ruff>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["target_app*", "fuzzer*", "firewall*", "evaluation*", "hardening*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
"firewall.gateway" = ["dashboard.html"]
"firewall.policies" = ["tool_policy.json"]
"firewall.models" = ["*.json"]
fuzzer = ["seeds/*.json"]
evaluation = ["benign/*.json", "train/*.json", "validation/*.json", "holdout/*.json"]





