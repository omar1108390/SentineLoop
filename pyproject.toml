[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelloop"
version = "0.1.0"
description = "A sandboxed prompt-injection firewall and red-team benchmark"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1"]

[tool.setuptools.packages.find]
include = ["target_app*", "fuzzer*", "firewall*"]

[tool.ruff]
line-length = 100
target-version = "py311"



